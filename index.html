<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hati Patah & Menyatu Otomatis</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Kanvas partikel bintang berkilau -->
  <canvas id="sparkle-canvas"></canvas>

  <!-- Kontainer utama hati -->
  <div class="heart-container" id="heart-wrapper">
    <div class="pulse-ring"></div>
    <div class="pulse-ring delay"></div>

    <svg class="heart-svg" viewBox="0 0 200 185" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <radialGradient id="heart-grad" cx="50%" cy="35%" r="65%">
          <stop offset="0%" id="grad-stop-1" stop-color="#ff85a2" />
          <stop offset="55%" id="grad-stop-2" stop-color="#ff1e56" />
          <stop offset="100%" id="grad-stop-3" stop-color="#8a0022" />
        </radialGradient>
      </defs>

      <!-- Bagian Kiri Hati (dengan jalur retakan zig-zag di tengah) -->
      <g class="heart-left">
        <path d="M100 32 C95 20 83 10 66 10 C40 10 15 30 15 62 C15 120 100 175 100 175 L91 142 L107 115 L90 88 L106 60 Z" 
              fill="url(#heart-grad)" />
        <!-- Kilau cahaya di bagian atas kiri -->
        <path d="M42 42 C48 28 64 25 74 30" 
              stroke="rgba(255,255,255,0.65)" 
              stroke-width="5" 
              stroke-linecap="round" 
              fill="none" />
      </g>

      <!-- Bagian Kanan Hati (dengan jalur retakan zig-zag yang klop dengan sisi kiri) -->
      <g class="heart-right">
        <path d="M100 32 C105 20 117 10 134 10 C160 10 185 30 185 62 C185 120 100 175 100 175 L91 142 L107 115 L90 88 L106 60 Z" 
              fill="url(#heart-grad)" />
      </g>
    </svg>
  </div>

  <script src="script.js"></script>
</body>
</html>
